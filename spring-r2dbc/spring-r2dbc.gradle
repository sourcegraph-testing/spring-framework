plugins {
	id 'org.sonarqube' version '7.4.0.8496'
}

description = "Spring R2DBC"

apply plugin: "kotlin"

dependencies {
	api(project(":spring-beans"))
	api(project(":spring-core"))
	api(project(":spring-tx"))
	api("io.projectreactor:reactor-core")
	api("io.r2dbc:r2dbc-spi")
	compileOnly("com.google.code.findbugs:jsr305") // for r2dbc-spi
	optional("org.jetbrains.kotlin:kotlin-reflect")
	optional("org.jetbrains.kotlin:kotlin-stdlib")
	optional("org.jetbrains.kotlinx:kotlinx-coroutines-core")
	optional("org.jetbrains.kotlinx:kotlinx-coroutines-reactor")
	testImplementation(testFixtures(project(":spring-beans")))
	testImplementation(testFixtures(project(":spring-context")))
	testImplementation(testFixtures(project(":spring-core")))
	testImplementation("io.projectreactor:reactor-test")
	testImplementation("io.r2dbc:r2dbc-h2")
	testImplementation("io.r2dbc:r2dbc-spi-test") {
		exclude group: "org.springframework", module: "spring-jdbc"
	}
}

// This module is analyzed as its own SonarQube project.
sonar {
	properties {
		property 'sonar.projectKey', 'org.springframework:spring-r2dbc'
		property 'sonar.projectName', 'Spring R2DBC'
		property 'sonar.projectVersion', project.version
		property 'sonar.sourceEncoding', 'UTF-8'
	}
}
