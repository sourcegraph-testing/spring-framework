plugins {
	id 'org.sonarqube' version '7.4.0.8496'
}

description = "Spring Context Indexer"

dependencies {
	testImplementation(project(":spring-context"))
	testImplementation("jakarta.annotation:jakarta.annotation-api")
	testImplementation("jakarta.inject:jakarta.inject-api")
	testImplementation("jakarta.persistence:jakarta.persistence-api")
	testImplementation("jakarta.transaction:jakarta.transaction-api")
}

nullability {
	requireExplicitNullMarking = false
}

// This module is analyzed as its own SonarQube project.
sonar {
	properties {
		property 'sonar.projectKey', 'org.springframework:spring-context-indexer'
		property 'sonar.projectName', 'Spring Context Indexer'
		property 'sonar.projectVersion', project.version
		property 'sonar.sourceEncoding', 'UTF-8'
	}
}
