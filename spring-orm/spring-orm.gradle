plugins {
	id 'org.sonarqube' version '7.4.0.8496'
}

description = "Spring Object/Relational Mapping"

dependencies {
	api(project(":spring-beans"))
	api(project(":spring-core"))
	api(project(":spring-jdbc"))
	api(project(":spring-tx"))
	compileOnly("org.graalvm.sdk:graal-sdk")
	optional(project(":spring-aop"))
	optional(project(":spring-context"))
	optional(project(":spring-web"))
	optional("jakarta.servlet:jakarta.servlet-api")
	optional("org.eclipse.persistence:org.eclipse.persistence.jpa")
	optional("org.hibernate.orm:hibernate-core")
	testImplementation(project(":spring-core-test"))
	testImplementation(testFixtures(project(":spring-beans")))
	testImplementation(testFixtures(project(":spring-context")))
	testImplementation(testFixtures(project(":spring-core")))
	testImplementation(testFixtures(project(":spring-web")))
	testImplementation("org.aspectj:aspectjweaver")
	testImplementation("org.hsqldb:hsqldb")
	testRuntimeOnly("jakarta.xml.bind:jakarta.xml.bind-api")
}

// This module is analyzed as its own SonarQube project.
sonar {
	properties {
		property 'sonar.projectKey', 'org.springframework:spring-orm'
		property 'sonar.projectName', 'Spring Object/Relational Mapping'
		property 'sonar.projectVersion', project.version
		property 'sonar.sourceEncoding', 'UTF-8'
	}
}
